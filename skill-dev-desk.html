<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>技能开发管理台</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --primary:#2563eb; --primary-weak:#eff4ff; --danger:#dc2626; --danger-weak:#fef2f2;
    --ok:#16a34a; --warn:#d97706; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .logo svg{width:22px;height:22px;fill:#fff}
  .ttl{flex:1 1 auto;min-width:160px}
  .ttl h1{font-size:19px;margin:0;font-weight:700}
  .ttl p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .sync.off .dot{background:var(--warn)}
  button{font-family:inherit;cursor:pointer}
  .btn{padding:10px 16px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px;min-height:44px}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{min-height:34px;padding:7px 11px;font-size:12.5px;border-radius:8px}
  .btn.ok{background:var(--ok)}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #fca5a5}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 svg{width:17px;height:17px;fill:var(--primary)}

  .today-head{display:flex;align-items:center;justify-content:space-between}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
  .pill.red{background:var(--danger-weak);color:var(--danger)}
  .pill.amber{background:#fff7ed;color:var(--warn)}
  .pill.gray{background:#f3f4f6;color:var(--muted)}
  .today-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .today-item:first-of-type{border-top:none}
  .today-item .nm{flex:1 1 auto;font-weight:600;font-size:14px}
  .today-item .meta{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:22px;font-weight:800;color:var(--primary)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}

  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted);min-height:42px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .item .body{flex:1 1 auto;min-width:0}
  .item .name{font-size:15px;font-weight:700;word-break:break-word}
  .item .desc{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
  .item .sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--primary-weak);color:var(--primary)}
  .badge.b0{background:#fef2f2;color:#b91c1c}
  .badge.b1{background:#eff6ff;color:#1d4ed8}
  .badge.b2{background:#f0fdf4;color:#15803d}
  .badge.b3{background:#fefce8;color:#a16207}
  .badge.tag{background:#f3f4f6;color:#475569}
  .badge.over{background:var(--danger-weak);color:var(--danger)}
  .acts{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  a.link{color:var(--primary);font-size:12.5px;text-decoration:none;word-break:break-all}

  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20}

  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  .sheet h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  .field textarea{resize:vertical;min-height:64px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;width:0;height:0}
  .chip label{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:#fff;cursor:pointer;user-select:none}
  .chip input:checked+label{background:var(--primary-weak);color:var(--primary);border-color:var(--primary)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sheet-acts{display:flex;gap:10px;margin-top:6px}
  .sheet-acts .btn{flex:1 1 auto;justify-content:center}
  @media(min-width:680px){.modal{align-items:center}.sheet{border-radius:18px}}

  @media(max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .wrap{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
    .item .acts{flex-direction:row}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm0 7.2L4.8 6 12 2.8 19.2 6 12 9.2ZM2 12l10 5 10-5M2 17l10 5 10-5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div class="ttl">
      <h1>技能开发管理台</h1>
      <p>管理 Skill / 工具 / 编排类技能的开发进度、任务与经验沉淀</p>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">已同步</span></div>
  </header>

  <section class="card">
    <div class="today-head">
      <h2><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-6h2v6Zm0-8h-2V7h2v2Z"/></svg>今天要处理</h2>
      <span class="pill red" id="todayCount" data-sp-bindable="database" data-sp-database-id="pzDOAGSpVB3fu8pSPhE0UC">0 项</span>
    </div>
    <div id="todayList"></div>
  </section>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="技能">技能清单</button>
    <button class="tab" data-cat="任务">开发任务</button>
    <button class="tab" data-cat="经验">经验沉淀</button>
  </div>

  <section class="card">
    <h2 id="catTitle"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h16v2H4z"/></svg><span id="catTitleTxt">技能清单</span></h2>
    <div id="list"></div>
  </section>
</div>

<button class="btn fab" id="addBtn"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>添加</button>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>新增条目</h3>
    <div class="field">
      <label>名称 *</label>
      <input type="text" id="f_name" placeholder="技能 / 任务 / 经验 的标题" maxlength="120">
    </div>
    <div class="row2">
      <div class="field">
        <label>类别 *</label>
        <select id="f_cat"></select>
      </div>
      <div class="field">
        <label>状态</label>
        <select id="f_status"></select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>优先级</label>
        <select id="f_prio"></select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="f_due">
      </div>
    </div>
    <div class="field">
      <label>所属技能</label>
      <input type="text" id="f_belong" placeholder="归属于哪个技能（可选）" maxlength="120">
    </div>
    <div class="field">
      <label>标签</label>
      <div class="chips" id="f_tags"></div>
    </div>
    <div class="field">
      <label>链接</label>
      <input type="url" id="f_url" placeholder="https://...（可选）">
    </div>
    <div class="field">
      <label>描述</label>
      <textarea id="f_desc" placeholder="目标 / 进展 / 坑点 / 复盘（可选）"></textarea>
    </div>
    <div class="sheet-acts">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var db = window.__SMART_PAGE__ && window.__SMART_PAGE__.database;
  var DATABASE_ID = 'pzDOAGSpVB3fu8pSPhE0UC';
  var SCHEMA_OPTIONS = {};   // { 字段名: [{text,id}] }
  var TODAY = new Date().toISOString().slice(0,10);
  var WEEK = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  var CURRENT_CAT = '技能';
  var ALL_ROWS = [];

  function $(id){ return document.getElementById(id); }
  function esc(s){ s = (s==null?'':String(s)); return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmtDate(iso){ if(!iso) return ''; return String(iso).slice(0,10); }
  function isOverdue(d){ return d && d < TODAY; }
  function isSoon(d){ return d && d >= TODAY && d <= WEEK; }
  function setSync(ok, txt){ var el=$('sync'); if(!ok){el.className='sync off';} else {el.className='sync';} $('syncTxt').textContent=txt; }

  // ---- schema + 选项填充 ----
  function fillOptions(schema){
    SCHEMA_OPTIONS = {};
    (schema.properties||[]).forEach(function(f){
      if((f.type==='select'||f.type==='multi_select') && f.config && f.config.options){
        SCHEMA_OPTIONS[f.name] = f.config.options;
      }
    });
    fillSelect($('f_cat'), SCHEMA_OPTIONS['类别']);
    fillSelect($('f_status'), SCHEMA_OPTIONS['状态']);
    fillSelect($('f_prio'), SCHEMA_OPTIONS['优先级']);
    fillTags($('f_tags'), SCHEMA_OPTIONS['标签']);
  }
  function fillSelect(sel, opts){
    if(!sel) return;
    sel.innerHTML = '<option value="">—</option>';
    (opts||[]).forEach(function(o){ var op=document.createElement('option'); op.value=o.id; op.textContent=o.text; sel.appendChild(op); });
  }
  function fillTags(box, opts){
    if(!box) return; box.innerHTML='';
    (opts||[]).forEach(function(o,i){
      var id='tag_'+i, lab=document.createElement('label'); lab.setAttribute('for',id); lab.textContent=o.text;
      var inp=document.createElement('input'); inp.type='checkbox'; inp.id=id; inp.value=o.id;
      var chip=document.createElement('span'); chip.className='chip'; chip.appendChild(inp); chip.appendChild(lab); box.appendChild(chip);
    });
  }

  // ---- 数据加载（翻页拉全量）----
  function loadData(startCursor, acc, guard){
    acc = acc||[]; guard = guard||0;
    if(guard>100){ renderAll(acc); return; }
    db.query({ databaseId:DATABASE_ID, pageSize:200, startCursor:startCursor })
      .then(function(res){
        acc = acc.concat(res.results||[]);
        var next = res.nextCursor;
        if(res.hasMore && next && next!==startCursor && (res.results||[]).length){
          loadData(next, acc, guard+1);
        } else { renderAll(acc); }
      })
      .catch(function(err){ console.error('[db] load fail', err); if(!acc.length) renderAll([]); });
  }

  // ---- 统一渲染入口（各 render 独立读 ALL_ROWS，互不调用）----
  function renderAll(rows){
    ALL_ROWS = rows||[];
    renderToday(ALL_ROWS);
    renderStats(ALL_ROWS);
    renderList(ALL_ROWS);
  }

  function renderToday(rows){
    var box=$('todayList'); box.innerHTML='';
    var items = (rows||[]).filter(function(r){
      return r['类别']==='任务' && r['状态']!=='已完成' && r['状态']!=='已发布' && r['状态']!=='已归档'
        && r['截止日期'] && (isOverdue(fmtDate(r['截止日期'])) || isSoon(fmtDate(r['截止日期'])));
    });
    items.sort(function(a,b){ var da=fmtDate(a['截止日期']), db_=fmtDate(b['截止日期']); return (da<db_?-1:da>db_?1:0); });
    $('todayCount').textContent = items.length + ' 项';
    if(!items.length){ box.innerHTML='<div class="empty">暂无逾期或临近截止的任务，状态良好。</div>'; return; }
    items.forEach(function(r){
      var overdue = isOverdue(fmtDate(r['截止日期']));
      var div=document.createElement('div'); div.className='today-item';
      div.innerHTML =
        '<div class="nm" data-sp-bindable="database" data-sp-database-id="pzDOAGSpVB3fu8pSPhE0UC">'+esc(r['名称'])+'</div>'+
        '<div class="meta">'+(overdue?'逾期 ':'截止 ')+esc(fmtDate(r['截止日期']))+' · '+esc(r['状态']||'')+'</div>'+
        '<button class="btn ok sm" data-id="'+esc(r._id)+'">完成</button>';
      div.querySelector('button').addEventListener('click', function(){ complete(r._id); });
      box.appendChild(div);
    });
  }

  function renderStats(rows){
    var box=$('stats'); box.innerHTML='';
    var skill=(rows||[]).filter(function(r){return r['类别']==='技能';}).length;
    var task=(rows||[]).filter(function(r){return r['类别']==='任务';}).length;
    var note=(rows||[]).filter(function(r){return r['类别']==='经验';}).length;
    var done=(rows||[]).filter(function(r){return r['状态']==='已完成'||r['状态']==='已发布';}).length;
    var data=[
      {n:skill,l:'技能'},{n:task,l:'任务'},{n:note,l:'经验'},{n:done,l:'已完成/发布'}
    ];
    data.forEach(function(s){
      var d=document.createElement('div'); d.className='stat';
      d.innerHTML='<div class="n" data-sp-bindable="database" data-sp-database-id="pzDOAGSpVB3fu8pSPhE0UC">'+s.n+'</div><div class="l">'+s.l+'</div>';
      box.appendChild(d);
    });
  }

  function renderList(rows){
    var box=$('list'); box.innerHTML='';
    $('catTitleTxt').textContent = CURRENT_CAT==='技能'?'技能清单':CURRENT_CAT==='任务'?'开发任务':'经验沉淀';
    var items=(rows||[]).filter(function(r){return r['类别']===CURRENT_CAT;});
    items.sort(function(a,b){ var x=a['名称']||'', y=b['名称']||''; return x<y?-1:x>y?1:0; });
    if(!items.length){ box.innerHTML='<div class="empty">还没有'+esc(CURRENT_CAT)+'，点右下角「添加」创建第一条。</div>'; return; }
    items.forEach(function(r){ box.appendChild(buildItem(r)); });
  }

  function buildItem(r){
    var div=document.createElement('div'); div.className='item';
    var tags=(r['标签']||[]).map(function(t){return '<span class="badge tag">'+esc(t)+'</span>';}).join('');
    var statusBadge = '<span class="badge b1">'+esc(r['状态']||'')+'</span>';
    var prio = r['优先级']&&r['优先级']!=='无' ? '<span class="badge b0">'+esc(r['优先级'])+'</span>' : '';
    var due='';
    if(r['截止日期']){ var d=fmtDate(r['截止日期']); if(isOverdue(d)){ due='<span class="badge over">逾期 '+esc(d)+'</span>'; } else { due='<span class="badge b3">截止 '+esc(d)+'</span>'; } }
    var belong = r['所属技能'] ? '<span class="badge">'+esc(r['所属技能'])+'</span>' : '';
    var link = r['链接']&&r['链接'].link ? '<a class="link" href="'+esc(r['链接'].link)+'" target="_blank" rel="noopener">'+esc(r['链接'].text||r['链接'].link)+'</a>' : '';

    var html='<div class="body">'+
      '<div class="name" data-sp-bindable="database" data-sp-database-id="pzDOAGSpVB3fu8pSPhE0UC">'+esc(r['名称'])+'</div>'+
      (r['描述']?'<div class="desc" data-sp-bindable="database" data-sp-database-id="pzDOAGSpVB3fu8pSPhE0UC">'+esc(r['描述'])+'</div>':'')+
      '<div class="sub">'+statusBadge+prio+belong+due+tags+(link?'<span>'+link+'</span>':'')+'</div>'+
      '</div>';
    var acts=document.createElement('div'); acts.className='acts';
    var doneBtn=document.createElement('button'); doneBtn.className='btn ok sm'; doneBtn.textContent='完成';
    doneBtn.addEventListener('click', function(){ complete(r._id); });
    var delBtn=document.createElement('button'); delBtn.className='btn danger sm'; delBtn.textContent='删除';
    delBtn.addEventListener('click', function(){ remove(r._id); });
    acts.appendChild(doneBtn); acts.appendChild(delBtn);

    div.innerHTML=html; div.appendChild(acts);
    return div;
  }

  // ---- 操作 ----
  function complete(id){
    db.updateRecord({ databaseId:DATABASE_ID, recordId:id, properties:{ '状态':{select:'已完成'} } })
      .then(function(){ loadData(); }).catch(function(e){ console.error(e); alert('更新失败，请重试'); });
  }
  function remove(id){
    if(!confirm('确认删除这条记录？此操作不可恢复。')) return;
    db.deleteRecord({ databaseId:DATABASE_ID, recordId:id })
      .then(function(){ loadData(); }).catch(function(e){ console.error(e); alert('删除失败，请重试'); });
  }

  // ---- 表单 ----
  function openModal(){ $('modal').classList.add('open'); }
  function closeModal(){ $('modal').classList.remove('open'); $('saveBtn').disabled=false; $('saveBtn').textContent='保存'; }
  function save(e){
    e.preventDefault();
    var name=$('f_name').value.trim();
    if(!name){ alert('请填写名称'); return; }
    var props={ '名称':{text:name}, '类别':{select:$('f_cat').value||'技能'} };
    var st=$('f_status').value; if(st) props['状态']={select:st};
    var pr=$('f_prio').value; if(pr) props['优先级']={select:pr};
    var bel=$('f_belong').value.trim(); if(bel) props['所属技能']={text:bel};
    var due=$('f_due').value; if(due) props['截止日期']={date:due};
    var tags=Array.prototype.map.call(document.querySelectorAll('#f_tags input:checked'), function(c){return c.value;});
    if(tags.length) props['标签']={multi_select:tags};
    var url=$('f_url').value.trim(); if(url) props['链接']={url:{text:url,link:url}};
    var desc=$('f_desc').value.trim(); if(desc) props['描述']={text:desc};

    $('saveBtn').disabled=true; $('saveBtn').textContent='保存中...';
    db.addRecord({ databaseId:DATABASE_ID, properties:props })
      .then(function(){ closeModal(); clearFormCache(); clearForm(); loadData(); })
      .catch(function(err){ console.error(err); alert('保存失败，请重试'); $('saveBtn').disabled=false; $('saveBtn').textContent='保存'; });
  }
  function clearForm(){ ['f_name','f_belong','f_url','f_desc'].forEach(function(i){$(i).value='';}); $('f_due').value=''; $('f_cat').value=''; $('f_status').value=''; $('f_prio').value=''; document.querySelectorAll('#f_tags input:checked').forEach(function(c){c.checked=false;}); }

  // ---- tab ----
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'), function(t){
    t.addEventListener('click', function(){ document.querySelectorAll('#tabs .tab').forEach(function(x){x.classList.remove('active');}); t.classList.add('active'); CURRENT_CAT=t.getAttribute('data-cat'); renderList(ALL_ROWS); });
  });

  $('addBtn').addEventListener('click', openModal);
  $('cancelBtn').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function(e){ if(e.target===$('modal')) closeModal(); });
  $('saveBtn').addEventListener('click', save);

  // ---- 数据变更订阅（他人改动 / 其他端提交时刷新）----
  function subscribe(){
    if(!db || typeof db.onUpdated!=='function') return;
    var t=null;
    db.onUpdated(function(payload){
      var ids=(payload&&payload.databaseIds)||[];
      if(ids.indexOf(DATABASE_ID)===-1) return;
      if(t) clearTimeout(t);
      t=setTimeout(function(){ t=null; loadData(); }, 300);
    });
  }

  // ---- init ----
  if(!db){
    setSync(false,'离线'); renderAll([]); return;
  }
  setSync(true,'已同步');
  db.getSchema({ databaseId:DATABASE_ID })
    .then(function(schema){ fillOptions(schema); loadData(); subscribe(); })
    .catch(function(err){ console.error('[db] schema fail', err); loadData(); subscribe(); });
})();
</script>
</body>
</html>
