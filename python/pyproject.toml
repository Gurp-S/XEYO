[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeyo"
version = "1.11.0"
description = "XEYO coding assistant engine"
requires-python = ">=3.11"
dependencies = [
	"httpx>=0.27.0",
	"pydantic>=2.0.0",
	"tokenizers>=0.22.1,<0.23",
]

[project.optional-dependencies]
# The CLI also exposes `serve`; preserve its complete existing command surface.
cli = ["typer>=0.12.0", "rich>=13.0.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "python-multipart>=0.0.12"]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "python-multipart>=0.0.12"]
product = ["typer>=0.12.0", "rich>=13.0.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "python-multipart>=0.0.12"]
dev = [
	"pytest>=8.0.0",
	"pytest-asyncio>=0.24.0",
	"pytest-timeout>=2.3.0",
]

[project.scripts]
xeyo = "xeyo._cli:main"

# 顶层单文件模块（非包目录）；不写进这里则 editable 安装后 from media_store 会失败。
[tool.setuptools]
py-modules = ["media_store"]

[tool.setuptools.package-data]
"model.reference_v41" = ["tokenizer.json", "LICENSE", "PROVENANCE.json"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "evals*", "*.tests", "*.tests.*"]
include = [
	"audit*",
	"bridge*",
	"channels*",
	"cli*",
	"codeindex*",
	"common*",
	"coord*",
	"diagnostics*",
	"engine*",
	"extension*",
	"lsp*",
	"memory*",
	"model*",
	"msgtypes*",
	"permissions*",
	"prompt*",
	"rewind*",
	"server*",
	"session*",
	"sidecar*",
	"slash*",
	"synaptic*",
	"tools*",
	"usage*",
	"xeyo*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
markers = [
	"live: hits real provider APIs (deselected unless --live)",
	"slow: long-running tests, allowed up to 300s",
	"channel: ilink 通道测试（fixture 做单例隔离）",
]
