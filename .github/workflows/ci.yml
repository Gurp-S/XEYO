name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q --timeout=60 -m "not live"

      - name: Slash manifest drift
        run: python -m slash.export_manifest --check

      - name: Stream contract drift
        # 后端帧名 / 请求体枚举改了却没重导出 gui/src/generated/streamContract.ts
        run: python -m server.export_stream_contract --check

  shell:
    name: Tauri shell (cargo check)
    # Windows runner：Tauri 在 Linux 上 cargo check 还要额外装 webkit2gtk 系列，
    # 而本项目只发 Windows 包 —— 装系统依赖的活儿不该让 CI 猜。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: cargo check
        run: cargo check --message-format=short
        working-directory: gui/src-tauri

  gui:
    name: GUI typecheck + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  tui:
    name: tui typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
