name: Engine package contract

on:
  push:
    branches: [main, master]
    paths: ["python/**", "scripts/verify_engine_wheel.py", ".github/workflows/engine-package.yml"]
  pull_request:
    paths: ["python/**", "scripts/verify_engine_wheel.py", ".github/workflows/engine-package.yml"]

jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build python --wheel --outdir dist/engine-contract
      - name: Clean engine and product installs
        shell: bash
        run: python scripts/verify_engine_wheel.py dist/engine-contract/*.whl --product
